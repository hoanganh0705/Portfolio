name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Puppeteer Chromium
        # pnpm blocks puppeteer's post-install script by default. Install
        # Chrome explicitly so lhci autorun can launch it.
        run: pnpm exec puppeteer browsers install chrome

      - name: Lighthouse CI
        run: pnpm lighthouse
        # Optional: install the LHCI GitHub App at https://github.com/apps/lighthouse-ci
        # to enable PR comment summaries. Without it, runs upload to
        # temporary-public-storage and exit non-zero on budget violations.
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
